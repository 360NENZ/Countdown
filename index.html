<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考倒计时</title>
<link rel="icon" href="https://cdn.jsdmirror.cn/gh/360NENZ/HomePage@master/assets/img/favicon.ico">
<script defer src="https://umami.360nenz.top/script.js" data-website-id="6759bb37-53f0-434a-91ee-78b226da65b5"></script>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<main>
    <section class="panel" aria-label="高考倒计时">
        <h1>高考倒计时</h1>
        <p id="kicker" class="kicker">距离 2026 年高考开始还有</p>
        <div id="timer" class="countdown">正在计算……</div>
        <div id="slogan" class="slogan">愿你笔锋所至，皆是心之所向</div>
        <div class="info">
            <div id="start-info">开始时间：2026 年 6 月 7 日 09:00:00</div>
            <div id="end-info">结束时间：2026 年 6 月 9 日 18:15:00</div>
            <div>
                <a href="https://www.tsa.cn/" rel="nofollow">国家授时中心标准时间</a>
                北京时间：
                <span id="Beijing_z43d">正在获取……</span>
            </div>
            <div id="local-date">本地日期：正在读取……</div>
            <div id="status" class="status"><span class="status-source">时间来源：国家授时中心标准时间</span><span class="status-refresh">倒计时每秒刷新。</span></div>
        </div>
    </section>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
